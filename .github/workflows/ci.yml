name: MYCA Core CI & Consensus Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-network:
    name: Verify Living Lattice & Zero-Gas Invariant
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Core Network Tests
        run: |
          cd packages/network
          node test/run_all_tests.js
          node tests/depin_machine_wallets.test.js
